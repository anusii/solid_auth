name: solid_auth
description: Authenticate to a Solid server (solidproject.org).
version: 0.1.28
homepage: https://github.com/anusii/solid_auth

environment:
  sdk: ">=3.2.3 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  clock: ^1.1.2
  dart_jsonwebtoken: ^3.4.0
  fast_rsa: ^3.8.1
  http: ^1.6.0
  jose: ^0.3.5+2
  logging: ^1.3.0
  oidc: ^0.14.0+2
  oidc_default_store: ^0.6.0+2
  openidconnect_web: ^1.0.26
  pointycastle: ^4.0.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  jwt_decoder: ^2.0.1
  # Keep dependency checker quiet.
  solid_auth_example:
    path: example

flutter:
  assets:
    - packages/fast_rsa/web/assets/worker.js
    - packages/fast_rsa/web/assets/wasm_exec.js
    - packages/fast_rsa/web/assets/rsa.wasm
