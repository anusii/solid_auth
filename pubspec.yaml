name: solid_auth
description: Authenticate to a Solid POD server using Solid-OIDC, built on the certified oidc package.
version: 1.0.0
homepage: https://github.com/anusii/solid_auth
repository: https://github.com/anusii/solid_auth

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:

  # Crypto package
  crypto: ^3.0.7

  # Core OIDC package (OpenID certified) replacing the forked openid_client
  oidc: ^0.14.0
  oidc_core: ^0.16.0
  oidc_default_store: ^0.6.0

  # JWT handling — kept for DPoP proof generation
  dart_jsonwebtoken: ^3.2.0

  # RSA key pair generation for DPoP
  fast_rsa: ^3.8.1

  # HTTP
  http: ^1.3.0

  # Utilities
  logging: ^1.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  clock: any
  flutter_lints: ^4.0.0
  jose: any
  mocktail: ^1.0.0
  openidconnect_web: any
  pointycastle: ^4.0.0
  solid_auth_example: any
  url_launcher: any
  web: any

# Running platforms
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# fast_rsa doesn't declare its own web assets in pubspec.yaml, so they
# must be declared here or they won't be present in the web build output.
flutter:
  assets:
    - packages/fast_rsa/web/assets/worker.js
    - packages/fast_rsa/web/assets/wasm_exec.js
    - packages/fast_rsa/web/assets/rsa.wasm
