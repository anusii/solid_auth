name: solid_auth
description: Authenticate to a Solid POD server using Solid-OIDC with certified oidc.
version: 1.1.0
homepage: https://github.com/anusii/solid_auth
repository: https://github.com/anusii/solid_auth

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.2.0
  flutter_secure_storage: ^10.3.4
  fast_rsa: ^3.8.1
  http: ^1.3.0
  http_parser: ^4.1.2
  logging: ^1.3.0
  oidc: ^4.0.0
  oidc_core: ^3.0.0
  oidc_default_store: ^1.1.2
  uuid: ^4.5.1
  web: ^1.1.1

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pointycastle: ^4.0.0
  url_launcher: any
  # 20260904 gjw The example is declared here so the dependency
  # checker sees the packages that only example/ imports (such as
  # url_launcher) as used.  Keep the name in step with
  # example/pubspec.yaml.
  solidautheg:
    path: example

# Running platforms
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# fast_rsa doesn't declare its own web assets in pubspec.yaml, so they
# must be declared here or they won't be present in the web build output.
flutter:
  assets:
    - packages/fast_rsa/web/assets/worker.js
    - packages/fast_rsa/web/assets/wasm_exec.js
    - packages/fast_rsa/web/assets/rsa.wasm
